# Главный конфиг сайта
#
user www-data;
worker_processes auto;   # по числу ядер
#worker_connections 4096;
events {
    # сколько соединений держит один процесс
    worker_connections 1024;
}
#
http {
    include mime.types;   #типы файлов
    # gzip on;
    server {
        listen 80;   # http
        #listen 443 ssl;
        server_name shop.example;
#       root /srv/old;
        root /srv/www;
    }
}
## конец
