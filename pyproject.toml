[project]
name = "hashpass"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["flask>=3.0", "textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hashpass = "hashpass.student_cli:main"
hashengine = "hashengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hashpass.registry" = ["templates/*.html.j2", "static/*.css", "static/*.js"]


[tool.pytest.ini_options]
addopts = "-m 'not tier3' -ra"
markers = [
    "tier1: pure logic, no containers",
    "tier2: docker/rootless-overlay, no sudo",
    "tier3: real systemd-nspawn, needs scoped sudo (local/self-hosted)",
]
