# Replace the console login (agetty on /dev/console) with a direct autologin into the
# hashpass fish console (/usr/local/sbin/hp-console). This is what makes the booted
# machine drop the student straight into a shell with no login prompt. Restart=no so
# that when hp-console powers the machine off on `exit`, systemd does not respawn it.
[Service]
ExecStart=
ExecStart=-/usr/local/sbin/hp-console
Restart=no
# HP_USER/HP_SUDO are set on the container's PID 1 via `systemd-nspawn --setenv`; services get a
# clean environment by default, so pass them explicitly through to hp-console.
PassEnvironment=HP_USER HP_SUDO HP_PORT
