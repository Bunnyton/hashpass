# hashpass, x86_64 images on another processor (qemu-user): applies to EVERY service.
# Their sandboxes need what qemu-user does not give: seccomp filters (status=228/SECCOMP) and
# some namespace set-ups (status=226/NAMESPACE). A throwaway task container gains nothing from
# them -- switch them off, as runtime 44 did for logind. On x86 this file is not mounted.
[Service]
PrivateTmp=no
PrivateDevices=no
PrivateNetwork=no
PrivateUsers=no
PrivateMounts=no
ProtectSystem=no
ProtectHome=no
ProtectHostname=no
ProtectClock=no
ProtectControlGroups=no
ProtectKernelLogs=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectProc=default
ProcSubset=all
ReadWritePaths=
ReadOnlyPaths=
InaccessiblePaths=
RestrictNamespaces=no
RestrictRealtime=no
RestrictSUIDSGID=no
RestrictAddressFamilies=
MemoryDenyWriteExecute=no
LockPersonality=no
NoNewPrivileges=no
SystemCallFilter=
SystemCallArchitectures=
SystemCallErrorNumber=
ImportCredential=
LoadCredential=
