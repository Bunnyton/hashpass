# /etc/nsswitch.conf -- Name Service Switch config for the hashpass base image.
# `hosts: files myhostname dns` resolves /etc/hosts first, then the container's own hostname
# and localhost via libnss-myhostname (works with the dynamic nspawn machine name), then DNS.

passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files myhostname dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
