# The stock logind sandbox needs mount namespaces; on some hosts (old kernels, qemu-user on ARM)
# setting them up fails with "Failed at step NAMESPACE … Invalid argument" and logind loops.
# A throwaway task container gains nothing from the sandbox -- switch it off.
[Service]
PrivateTmp=no
PrivateDevices=no
ProtectSystem=no
ProtectHome=no
ProtectHostname=no
ProtectClock=no
ProtectControlGroups=no
ProtectKernelLogs=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectProc=default
ReadWritePaths=
RestrictNamespaces=no
MemoryDenyWriteExecute=no
LockPersonality=no
SystemCallFilter=
SystemCallArchitectures=
ImportCredential=
